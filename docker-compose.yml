# ── Yiriba SaaS — Docker Compose ─────────────────────────────────
version: "3.9"

services:
  app:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://yiriba:yiriba_secret@db:5432/yiriba
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yiriba
      POSTGRES_USER: yiriba
      POSTGRES_PASSWORD: yiriba_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiriba"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

volumes:
  pg_data:
  uploads_data:
