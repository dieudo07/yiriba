<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialisation du mot de passe — YIRIBA</title>
<link rel="icon" type="image/jpeg" href="/logo/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --yiriba-vert: #2e7d32;
    --yiriba-vert-profond: #1b5e20;
    --texte-secondaire: #5f6368;
    --border: #e0e0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: linear-gradient(135deg, #f0faf4, #e8f5e9);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(27,94,32,0.12);
    max-width: 430px; width: 100%; padding: 36px 30px; text-align: center;
  }
  h1 { font-family: 'Sora', sans-serif; font-size: 19px; color: var(--yiriba-vert-profond); margin-bottom: 8px; }
  p { font-size: 14px; color: var(--texte-secondaire); line-height: 1.6; margin-bottom: 20px; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; outline: none;
  }
  .field input:focus { border-color: var(--yiriba-vert); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; justify-content: center; width: 100%;
    background: var(--yiriba-vert); color: white; border: none; border-radius: 10px;
    padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--yiriba-vert-profond); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #c62828; font-size: 13px; margin: 10px 0; display: none; }
  .success { color: #2e7d32; font-size: 13px; margin: 10px 0; display: none; }
  .badge { width: 64px; height: 64px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .badge i { font-size: 30px; color: var(--yiriba-vert); font-style: normal; }
</style>
</head>
<body>
<div class="card">
  <div class="badge"><i>&#128274;</i></div>
  <h1>Nouveau mot de passe</h1>
  <p>Choisissez un mot de passe sécurisé (minimum 8 caractères).</p>
  <div class="field"><label>Nouveau mot de passe</label><input type="password" id="pwd" autocomplete="new-password" placeholder="Minimum 8 caractères"></div>
  <div class="field"><label>Confirmer le mot de passe</label><input type="password" id="pwd2" autocomplete="new-password" placeholder="Retapez le mot de passe"></div>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <button class="btn" id="btn">Réinitialiser le mot de passe</button>
</div>
<script>
  const API = '/api';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const pwd = document.getElementById('pwd');
  const pwd2 = document.getElementById('pwd2');
  const err = document.getElementById('error');
  const ok = document.getElementById('success');
  const btn = document.getElementById('btn');
  const show = (el, msg) => { el.style.display = 'block'; el.textContent = msg; };
  btn.onclick = async () => {
    err.style.display = 'none'; ok.style.display = 'none';
    if (!token) { show(err, 'Lien invalide ou expiré. Repassez par « Mot de passe oublié ».', ); return; }
    if (pwd.value.length < 8) { show(err, 'Le mot de passe doit contenir au moins 8 caractères.'); return; }
    if (pwd.value !== pwd2.value) { show(err, 'Les deux mots de passe ne correspondent pas.'); return; }
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    try {
      const r = await fetch(API + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: pwd.value })
      });
      const d = await r.json();
      if (!r.ok) {
        show(err, d.detail ? (typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail)) : 'Erreur lors du changement de mot de passe.');
        btn.disabled = false; btn.textContent = 'Réinitialiser le mot de passe'; return;
      }
      show(ok, 'Mot de passe réinitialisé avec succès.');
      btn.style.display = 'none';
      window.location.href = '/';
    } catch (e) {
      show(err, 'Impossible de contacter le serveur. Réessayez.');
      btn.disabled = false; btn.textContent = 'Réinitialiser le mot de passe';
    }
  };
</script>
</body>
</html>
