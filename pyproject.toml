[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "yiriba-saas"
version = "2.0.0"
description = "SaaS de gestion scolaire pour le Burkina Faso — multi-établissement, sécurisé, mobile-first"
readme = "README.md"
# Note : hatchling exige la présence du README au build. Le Dockerfile le
# copie donc AVANT l'installation des dépendances.
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    { name = "Yiriba Team" },
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "python-dateutil>=2.9,<3",
    "fpdf2>=2.8,<3",
    "qrcode>=7.4,<8",
    "pillow>=10.0,<11",
    "pandas>=2.0,<4",
    "openpyxl>=3.1,<4",
    "xhtml2pdf>=0.2.16,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
    "factory-boy>=3.3,<4",
]
prod = [
    "gunicorn>=22.0,<23",
    "psycopg2-binary>=2.9,<3",
]

[project.scripts]
yiriba = "app.main:cli"

# ── Ruff (lint + format) ──────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (sécurité)
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "T201",  # print() autorisé en dev
    "S101",  # assert autorisé dans les tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"app/schemas/**" = ["N802", "N815"]
"scripts/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Mypy (typage statique) ────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Pytest ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Tests unitaires rapides",
    "integration: Tests d'intégration (nécessitent DB)",
    "security: Tests de sécurité (isolation multi-tenant, IDOR)",
]

# ── Coverage ───────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
